[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "set-downloader"
version = "0.1.0"
description = "Any tracklist (a link, text, a CSV, a screenshot, a saved 1001Tracklists page) -> its tracks from Soulseek, YouTube or the set's recording (tl2mixxx + sockseek + yt-dlp)"
requires-python = ">=3.10"
dependencies = ["tl2mixxx[media,ocr]>=0.5", "pywebview>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
set-downloader = "setdl.app:main"

[tool.setuptools.packages.find]
include = ["setdl*"]

# tl2mixxx isn't on PyPI: it comes from its own folder next to this one
[tool.uv.sources]
tl2mixxx = { path = "../tl2mixxx", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
